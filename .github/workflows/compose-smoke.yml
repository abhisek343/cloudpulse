name: Compose Demo Smoke

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "monitoring/**"
      - "scripts/demo-smoke.sh"
      - "services/**"
      - "frontend/**"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "monitoring/**"
      - "scripts/demo-smoke.sh"
      - "services/**"
      - "frontend/**"
      - ".github/workflows/compose-smoke.yml"

jobs:
  demo:
    name: Safe demo stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the safe local demo
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Exercise API, frontend, monitoring, and seeded demo path
        run: bash scripts/demo-smoke.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
